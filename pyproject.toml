[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-demand-forecasting"
version = "0.1.0"
description = "Leakage-aware one-day-ahead retail demand forecasting with walk-forward evaluation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3"]

[project.scripts]
retail-forecast = "retail_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
